[project]
name = "eps-runcoach"
version = "0.1.0"
description = "A private, single-user desktop app for recreational runners: FIT import, training metrics, and an AI coach."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "escull_h", email = "edwinscull@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fitdecode>=0.11.0",
    "google-genai>=2.23.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "ttkbootstrap>=2.2.2",
]

[project.scripts]
eps-runcoach = "eps_runcoach:main"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
]
